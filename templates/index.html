<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimisation de livraison</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }

    header {
      background: #1a73e8; color: white;
      padding: 16px 22px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }

    .layout { display: flex; height: calc(100vh - 58px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 380px; min-width: 300px; background: white;
      display: flex; flex-direction: column;
      border-right: 1px solid #ddd; overflow: hidden;
    }

    .upload-zone { padding: 18px; border-bottom: 1px solid #eee; }
    .upload-zone h2 { font-size: .85rem; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

    .drop-area {
      border: 2px dashed #1a73e8; border-radius: 10px;
      padding: 22px 14px; text-align: center; cursor: pointer;
      transition: background .2s; position: relative;
    }
    .drop-area:hover, .drop-area.dragover { background: #e8f0fe; }
    .drop-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop-area .icon { font-size: 2rem; }
    .drop-area p { color: #666; font-size: .85rem; margin-top: 5px; }
    #file-name { font-size: .8rem; color: #1a73e8; margin-top: 8px; word-break: break-all; min-height: 1em; }

    .start-option { margin-top: 12px; }
    .start-option label { font-size: .83rem; color: #555; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .start-row { display: flex; gap: 6px; margin-top: 6px; }
    .start-row input[type=text] {
      flex: 1; padding: 8px 10px;
      border: 1px solid #ccc; border-radius: 6px; font-size: .83rem;
    }
    .start-row input[type=text]:disabled { background: #f5f5f5; }
    .gps-btn {
      padding: 0 10px; background: #e8f0fe; border: 1px solid #1a73e8;
      border-radius: 6px; cursor: pointer; font-size: 1.1rem;
      transition: background .2s; flex-shrink: 0;
    }
    .gps-btn:hover { background: #c6d8fc; }
    .gps-btn:disabled { opacity: .4; cursor: not-allowed; }

    .btn-sample {
      display: block; width: 100%; margin-top: 12px;
      padding: 9px; background: #f0f4ff; color: #1a73e8;
      border: 1.5px dashed #1a73e8; border-radius: 8px; font-size: .84rem;
      cursor: pointer; font-weight: 500; text-align: center;
      text-decoration: none; transition: background .2s;
    }
    .btn-sample:hover { background: #dce8ff; }

    .btn {
      display: block; width: 100%; margin-top: 12px;
      padding: 11px; background: #1a73e8; color: white;
      border: none; border-radius: 8px; font-size: .95rem;
      cursor: pointer; font-weight: 600; transition: background .2s;
    }
    .btn:hover { background: #1558b0; }
    .btn:disabled { background: #9cb8f0; cursor: not-allowed; }

    /* ── Results ── */
    .results-panel { flex: 1; overflow-y: auto; padding: 14px 18px; }

    .summary-bar {
      display: none; background: #e8f0fe; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 12px;
      font-size: .88rem; color: #1a73e8; font-weight: 600;
    }

    .stop-card {
      background: white; border: 1px solid #e0e0e0; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
      display: flex; gap: 10px; align-items: flex-start;
      cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .stop-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); border-color: #1a73e8; }
    .stop-card.no-geo { opacity: .6; cursor: default; }

    .stop-num {
      min-width: 30px; height: 30px; background: #1a73e8; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .8rem; flex-shrink: 0;
    }
    .stop-num.no-geo { background: #aaa; }

    .stop-info { flex: 1; min-width: 0; }
    .stop-raw { font-weight: 600; font-size: .86rem; word-break: break-word; }
    .stop-full { font-size: .75rem; color: #777; margin-top: 2px; word-break: break-word; }
    .stop-dist { font-size: .73rem; color: #1a73e8; margin-top: 3px; }
    .stop-dist.warn { color: #c00; }

    /* ── Progress ── */
    .progress-wrap { display: none; padding: 10px 0 4px; }
    .progress-label { font-size: .8rem; color: #555; margin-bottom: 5px; }
    .progress-bar-bg { height: 6px; background: #e0e0e0; border-radius: 3px; }
    .progress-bar-fg { height: 6px; background: #1a73e8; border-radius: 3px; width: 0; transition: width .3s; }

    .btn-gmaps {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; padding: 10px 14px;
      background: #fff; border: 2px solid #4285f4; border-radius: 8px;
      color: #4285f4; font-weight: 700; font-size: .88rem;
      text-decoration: none; transition: background .2s, color .2s;
    }
    .btn-gmaps:hover { background: #4285f4; color: white; }

    .error-box {
      background: #fce8e8; border: 1px solid #f44; border-radius: 8px;
      padding: 10px 12px; color: #c00; font-size: .84rem; display: none; margin-bottom: 10px;
      white-space: pre-wrap; word-break: break-word;
    }

    /* ── Map ── */
    #map { flex: 1; min-width: 0; }

    @media (max-width: 680px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: 55vh; border-right: none; border-bottom: 1px solid #ddd; }
      #map { height: 45vh; }
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">🚚</span>
  <h1>Optimisation de livraison</h1>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="upload-zone">
      <h2>Importer un PDF client</h2>

      <div class="drop-area" id="drop-area">
        <div class="icon">📄</div>
        <strong>Cliquez ou glissez votre PDF</strong>
        <p>Fichier contenant les adresses clients</p>
        <input type="file" id="pdf-input" accept=".pdf">
      </div>
      <div id="file-name"></div>

      <div class="start-option">
        <label>
          <input type="checkbox" id="use-start"> Point de départ (entrepôt / domicile)
        </label>
        <div class="start-row">
          <input type="text" id="start-address" placeholder="Ex: 1234 rue Principale, Montréal" disabled>
          <button class="gps-btn" id="gps-btn" title="Utiliser ma position GPS" disabled>📍</button>
        </div>
      </div>

      <a class="btn-sample" href="/static/clients_exemple.pdf" download>
        📥 Télécharger un PDF exemple (12 clients Montréal)
      </a>

      <button class="btn" id="process-btn" disabled>Analyser et trier les livraisons</button>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-label" id="progress-label">Géocodage 0 / 0…</div>
        <div class="progress-bar-bg"><div class="progress-bar-fg" id="progress-bar"></div></div>
      </div>
    </div>

    <div class="results-panel">
      <div class="error-box" id="error-box"></div>
      <div class="summary-bar" id="summary-bar"></div>
      <a class="btn-gmaps" id="gmaps-btn" target="_blank" style="display:none">
        <img src="https://maps.google.com/mapfiles/ms/icons/red-dot.png" style="width:16px;height:16px;vertical-align:middle;margin-right:6px">
        Ouvrir le trajet dans Google Maps
      </a>
      <div id="stops-list"></div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([45.5, -73.6], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);
let markers = [], routeLine = null;

function clearMap() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
}

function numIcon(n, color = '#1a73e8') {
  return L.divIcon({
    className: '',
    html: `<div style="background:${color};color:white;border-radius:50%;width:28px;height:28px;
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
      border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3)">${n}</div>`,
    iconSize: [28, 28], iconAnchor: [14, 14]
  });
}

function drawRoute(route) {
  const lls = [];
  route.forEach((s, i) => {
    if (s.lat == null) return;
    const m = L.marker([s.lat, s.lon], { icon: numIcon(i + 1) }).addTo(map)
      .bindPopup(`<b>#${i+1}</b><br>${s.raw}`);
    markers.push(m);
    lls.push([s.lat, s.lon]);
  });
  if (lls.length > 1) {
    routeLine = L.polyline(lls, { color: '#1a73e8', weight: 3, dashArray: '7 6' }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
  } else if (lls.length === 1) {
    map.setView(lls[0], 13);
  }
}

// ── Geocoding (via serveur — clé API gardée sécurisée) ───────────────────────
async function geocode(address) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch('/geocode?address=' + encodeURIComponent(address), { signal: ctrl.signal });
    clearTimeout(timer);
    const d = await r.json();
    if (d.found) return { lat: d.lat, lon: d.lon, display: d.display };
    return { lat: null, lon: null, reason: d.reason };
  } catch (e) {
    clearTimeout(timer);
    return { lat: null, lon: null, reason: e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK_ERROR' };
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Route optimization : nearest-neighbor + 2-opt ────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, d2r = Math.PI / 180;
  const dlat = (lat2 - lat1) * d2r, dlon = (lon2 - lon1) * d2r;
  const a = Math.sin(dlat/2)**2 + Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dlon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function totalDistance(route, sLat, sLon) {
  let d = haversine(sLat, sLon, route[0].lat, route[0].lon);
  for (let i = 0; i < route.length - 1; i++)
    d += haversine(route[i].lat, route[i].lon, route[i+1].lat, route[i+1].lon);
  return d;
}

function nearestNeighbor(points, sLat, sLon) {
  const unvisited = [...points];
  const route = [];
  let curLat = sLat, curLon = sLon;
  while (unvisited.length) {
    let best = 0, bestDist = Infinity;
    unvisited.forEach((p, i) => {
      const d = haversine(curLat, curLon, p.lat, p.lon);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    const chosen = unvisited.splice(best, 1)[0];
    curLat = chosen.lat; curLon = chosen.lon;
    route.push(chosen);
  }
  return route;
}

function twoOpt(route, sLat, sLon) {
  // Open-path 2-opt: keep first stop free (no return to depot)
  let improved = true;
  while (improved) {
    improved = false;
    for (let i = 0; i < route.length - 1; i++) {
      for (let j = i + 2; j < route.length; j++) {
        // Edge A→B = route[i] → route[i+1]
        // Edge C→D = route[j] → route[j+1]  (skip last for open path)
        if (j + 1 >= route.length) continue;
        const A = route[i], B = route[i+1], C = route[j], D = route[j+1];
        const before = haversine(A.lat,A.lon,B.lat,B.lon) + haversine(C.lat,C.lon,D.lat,D.lon);
        const after  = haversine(A.lat,A.lon,C.lat,C.lon) + haversine(B.lat,B.lon,D.lat,D.lon);
        if (after < before - 0.001) {
          // Reverse segment [i+1 .. j]
          let l = i + 1, r = j;
          while (l < r) { [route[l], route[r]] = [route[r], route[l]]; l++; r--; }
          improved = true;
        }
      }
    }
  }
  return route;
}

function recalcDistances(route, sLat, sLon) {
  route.forEach((p, i) => {
    const prev = i === 0 ? { lat: sLat, lon: sLon } : route[i-1];
    p.distFromPrev = Math.round(haversine(prev.lat, prev.lon, p.lat, p.lon) * 10) / 10;
  });
}

function optimizeRoute(points, startLat, startLon) {
  const valid   = points.filter(p => p.lat != null);
  const invalid = points.filter(p => p.lat == null);
  if (!valid.length) return invalid;

  const sLat = startLat ?? valid.reduce((s,p) => s+p.lat, 0) / valid.length;
  const sLon = startLon ?? valid.reduce((s,p) => s+p.lon, 0) / valid.length;

  // Step 1 — nearest-neighbor seed
  const seed = nearestNeighbor(valid, sLat, sLon);
  const distBefore = totalDistance(seed, sLat, sLon);

  // Step 2 — 2-opt improvement
  const route = twoOpt(seed, sLat, sLon);
  const distAfter = totalDistance(route, sLat, sLon);

  recalcDistances(route, sLat, sLon);

  const saving = Math.round((1 - distAfter / distBefore) * 100);
  route._saving = saving > 0 ? saving : 0;

  return [...route, ...invalid];
}

// ── UI helpers ────────────────────────────────────────────────────────────────
const errorBox   = document.getElementById('error-box');
const summaryBar = document.getElementById('summary-bar');
const gmapsBtn   = document.getElementById('gmaps-btn');
const stopsList  = document.getElementById('stops-list');
const progressWrap  = document.getElementById('progress-wrap');
const progressLabel = document.getElementById('progress-label');
const progressBar   = document.getElementById('progress-bar');
const processBtn    = document.getElementById('process-btn');

function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
function hideError()    { errorBox.style.display = 'none'; }

function buildGmapsUrl(route, startLat, startLon) {
  const geocoded = route.filter(p => p.lat != null);
  if (!geocoded.length) return null;

  // Google Maps supports up to 10 waypoints (12 total stops)
  const MAX = 10;
  const stops = geocoded.slice(0, MAX + 2); // origin + 10 waypoints + destination

  const parts = [];
  if (startLat != null) parts.push(`${startLat},${startLon}`);
  stops.forEach(p => parts.push(`${p.lat},${p.lon}`));

  const url = 'https://www.google.com/maps/dir/' + parts.join('/');
  const warning = geocoded.length > MAX + 2
    ? ` (⚠ Google Maps gratuit: ${MAX + 2} arrêts max affichés sur ${geocoded.length})`
    : '';
  return { url, warning };
}

function setProgress(done, total) {
  progressLabel.textContent = `Géocodage des adresses… ${done} / ${total}`;
  progressBar.style.width = `${Math.round(done / total * 100)}%`;
}

function renderStops(route) {
  stopsList.innerHTML = '';
  route.forEach((stop, i) => {
    const card = document.createElement('div');
    card.className = 'stop-card' + (stop.lat == null ? ' no-geo' : '');
    card.innerHTML = `
      <div class="stop-num${stop.lat == null ? ' no-geo' : ''}">${i + 1}</div>
      <div class="stop-info">
        <div class="stop-raw">${stop.raw}</div>
        ${stop.display && stop.display !== stop.raw
          ? `<div class="stop-full">${stop.display}</div>` : ''}
        ${stop.lat != null
          ? `<div class="stop-dist">+${stop.distFromPrev} km depuis l'arrêt précédent</div>`
          : `<div class="stop-dist warn">⚠ Non géolocalisée${stop.reason ? ' — ' + stop.reason : ''}</div>`}
      </div>`;
    if (stop.lat != null) {
      card.addEventListener('click', () => {
        map.setView([stop.lat, stop.lon], 15);
        markers.find(m => {
          const ll = m.getLatLng();
          return Math.abs(ll.lat - stop.lat) < 0.0001 && Math.abs(ll.lng - stop.lon) < 0.0001;
        })?.openPopup();
      });
    }
    stopsList.appendChild(card);
  });
}

// ── File input ────────────────────────────────────────────────────────────────
const dropArea  = document.getElementById('drop-area');
const pdfInput  = document.getElementById('pdf-input');
const fileName  = document.getElementById('file-name');
const useStart  = document.getElementById('use-start');
const startAddr = document.getElementById('start-address');
const gpsBtn    = document.getElementById('gps-btn');

// GPS-fixed coordinates (set when user clicks 📍)
let gpsLat = null, gpsLon = null;
let gpsMarker = null;

// Store the selected file in a variable — pdfInput.files can be unreliable after drop
let selectedFile = null;

function setFile(file) {
  selectedFile = file;
  fileName.textContent = file.name;
  processBtn.disabled = false;
}

pdfInput.addEventListener('change', () => {
  if (pdfInput.files[0]) setFile(pdfInput.files[0]);
});
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => {
  e.preventDefault(); dropArea.classList.remove('dragover');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
useStart.addEventListener('change', () => {
  const on = useStart.checked;
  startAddr.disabled = !on;
  gpsBtn.disabled = !on;
  if (!on) { gpsLat = null; gpsLon = null; if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; } }
});

gpsBtn.addEventListener('click', () => {
  if (!navigator.geolocation) { showError('Géolocalisation non supportée par ce navigateur.'); return; }
  gpsBtn.textContent = '⏳';
  gpsBtn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      gpsLat = pos.coords.latitude;
      gpsLon = pos.coords.longitude;
      startAddr.value = '';
      startAddr.placeholder = `📍 GPS : ${gpsLat.toFixed(5)}, ${gpsLon.toFixed(5)}`;
      gpsBtn.textContent = '✅';
      gpsBtn.disabled = false;
      if (gpsMarker) map.removeLayer(gpsMarker);
      const homeIcon = L.divIcon({
        className: '',
        html: `<div style="background:#e53935;color:white;border-radius:50%;width:32px;height:32px;
          display:flex;align-items:center;justify-content:center;font-size:16px;
          border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3)">🏠</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16]
      });
      gpsMarker = L.marker([gpsLat, gpsLon], { icon: homeIcon }).addTo(map).bindPopup('<b>Départ (GPS)</b>');
      map.setView([gpsLat, gpsLon], 13);
    },
    err => {
      gpsBtn.textContent = '📍';
      gpsBtn.disabled = false;
      const msgs = { 1: 'Permission refusée.', 2: 'Position introuvable.', 3: 'Délai dépassé.' };
      showError('GPS : ' + (msgs[err.code] || err.message));
    },
    { timeout: 10000, enableHighAccuracy: true }
  );
});

// ── Main flow ─────────────────────────────────────────────────────────────────
processBtn.addEventListener('click', async () => {
  if (!selectedFile) { showError('Veuillez sélectionner un fichier PDF.'); return; }
  hideError();
  summaryBar.style.display = 'none';
  gmapsBtn.style.display = 'none';
  stopsList.innerHTML = '';
  clearMap();
  processBtn.disabled = true;
  progressWrap.style.display = 'block';
  progressLabel.textContent = '⏳ Envoi du PDF au serveur…';
  progressBar.style.width = '5%';

  // 1. Extract addresses from PDF (server)
  const form = new FormData();
  form.append('pdf', selectedFile);
  let addresses;
  try {
    const resp = await fetch('/extract', { method: 'POST', body: form });
    if (!resp.ok) {
      const txt = await resp.text();
      showError(`Erreur serveur (${resp.status}) : ${txt.slice(0, 300)}`);
      processBtn.disabled = false;
      progressWrap.style.display = 'none';
      return;
    }
    const data = await resp.json();
    if (data.error) {
      showError(data.error + (data.preview ? '\n\n── Texte extrait du PDF ──\n' + data.preview : ''));
      processBtn.disabled = false;
      progressWrap.style.display = 'none';
      return;
    }
    addresses = data.addresses;
  } catch (err) {
    showError('Impossible de contacter le serveur : ' + err.message);
    processBtn.disabled = false;
    progressWrap.style.display = 'none';
    return;
  }

  // 2. Check which geocoder is active
  let provider = 'nominatim';
  try { const p = await fetch('/geocode/provider'); const pd = await p.json(); provider = pd.provider; } catch (_) {}

  // 3. Géocodage du point de départ
  let startLat = null, startLon = null;
  if (useStart.checked) {
    if (gpsLat !== null) {
      // GPS déjà obtenu — pas besoin de géocoder
      startLat = gpsLat; startLon = gpsLon;
      if (gpsMarker) markers.push(gpsMarker);
    } else if (startAddr.value.trim()) {
      progressLabel.textContent = '⏳ Géocodage du point de départ…';
      progressBar.style.width = '10%';
      const pos = await geocode(startAddr.value.trim());
      if (pos?.lat) {
        startLat = pos.lat; startLon = pos.lon;
        const homeIcon = L.divIcon({
          className: '',
          html: `<div style="background:#e53935;color:white;border-radius:50%;width:32px;height:32px;
            display:flex;align-items:center;justify-content:center;font-size:16px;
            border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3)">🏠</div>`,
          iconSize: [32, 32], iconAnchor: [16, 16]
        });
        markers.push(L.marker([startLat, startLon], { icon: homeIcon }).addTo(map).bindPopup('<b>Départ</b>'));
      } else {
        showError(`Point de départ non trouvé (${pos?.reason ?? 'ZERO_RESULTS'}). La route sera optimisée depuis le centre des adresses.`);
      }
    }
  }

  // 4. Geocode all addresses
  const points = [];
  for (let i = 0; i < addresses.length; i++) {
    setProgress(i, addresses.length);
    const pos = await geocode(addresses[i]);
    points.push({
      raw: addresses[i],
      lat: pos?.lat ?? null,
      lon: pos?.lon ?? null,
      display: pos?.display ?? null,
      reason: pos?.reason ?? null,
      distFromPrev: 0,
    });
  }
  setProgress(addresses.length, addresses.length);

  // 4. Optimize route
  const route = optimizeRoute(points, startLat, startLon);
  const totalKm = route.reduce((s, p) => s + (p.distFromPrev || 0), 0);

  // 5. Render
  const providerBadge = provider === 'google'
    ? `<span style="font-size:.75rem;background:#34a853;color:white;padding:1px 7px;border-radius:10px;margin-left:8px">Google Maps</span>`
    : `<span style="font-size:.75rem;background:#777;color:white;padding:1px 7px;border-radius:10px;margin-left:8px">OpenStreetMap</span>`;
  const savingBadge = route._saving > 0
    ? `<span style="font-size:.75rem;background:#ff6f00;color:white;padding:1px 7px;border-radius:10px;margin-left:6px">2-opt −${route._saving}%</span>`
    : '';
  summaryBar.style.display = 'block';
  summaryBar.innerHTML = `✅ <b>${route.length} arrêts</b> &nbsp;·&nbsp; Distance estimée : <b>${Math.round(totalKm * 10) / 10} km</b> ${providerBadge}${savingBadge}`;

  // Google Maps button
  const gmaps = buildGmapsUrl(route, startLat, startLon);
  if (gmaps) {
    gmapsBtn.href = gmaps.url;
    gmapsBtn.style.display = 'flex';
    gmapsBtn.title = gmaps.warning || '';
    if (gmaps.warning) gmapsBtn.innerHTML += `<br><small style="font-weight:400;font-size:.72rem">${gmaps.warning}</small>`;
  } else {
    gmapsBtn.style.display = 'none';
  }

  renderStops(route);
  drawRoute(route);

  progressWrap.style.display = 'none';
  processBtn.disabled = false;
});
</script>
</body>
</html>
